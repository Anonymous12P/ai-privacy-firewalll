[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-privacy-firewall-backend"
version = "0.1.0"
description = "FastAPI scaffold for AI-Privacy-Firewall"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi",
    "pydantic-settings>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
